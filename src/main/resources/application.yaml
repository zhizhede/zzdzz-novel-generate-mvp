server:
  port: 8090

spring:
  application:
    name: novelgen-server
  datasource:
    url: ${NOVELGEN_DB_URL:jdbc:postgresql://localhost:5432/novel_gen}
    username: ${NOVELGEN_DB_USER:postgres}
    password: ${NOVELGEN_DB_PASS:}
  flyway:
    enabled: true
    locations: classpath:db/migration

novelgen:
  auth:
    # 开发兜底密钥；本地/生产用 application-local.yaml 或环境变量覆盖（HS256 需 ≥32 字节）
    jwt-secret: ${NOVELGEN_AUTH_JWT_SECRET:dev-only-secret-please-override-in-local-yaml-0123456789}
    ttl-days: 7
  llm:
    base-url: ${NOVELGEN_LLM_BASE_URL:https://api.minimaxi.com/v1}
    api-key: ${NOVELGEN_LLM_API_KEY:}
    model: ${NOVELGEN_LLM_MODEL:MiniMax-M3}
    connect-timeout: 10s
    read-timeout: 600s
  style-dir: ${NOVELGEN_STYLE_DIR:docs/style}
  novel-dir: ${NOVELGEN_NOVEL_DIR:novel/夜班守则}
