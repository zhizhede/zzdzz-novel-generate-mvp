chapter_default:
  budget_min: 1800
  budget_max: 2800
volumes:
  - num: 3
    title: 呼吸石与紫纹
    chapters:
      - num: 29
        title: 出发与许可
        goal: 卢卡持子爵府许可正式入城；芬恩死缠着同行；莉娜送到篱笆外只说一句"早点回来"；咱家以"监督人类蠢行"的名义随行
        hook: 许可文书末尾的官印纹样，与地下城墙上的螺旋刻痕是同一种结构——咱家眯眼多看了一眼
      - num: 30
        title: 第一层的壁画
        goal: 卢卡逐段研究壁画与刻痕文字，发现游记作者的署名被人凿去；咱家的观察记视角写第一层魔物生态与冒险者众生相
        hook: 壁画的角落里，画着一只缺了左耳的猫
      - num: 31
        title: 发热的呼吸石
        goal: 深入第一层支线，呼吸石开始发热（塞尔文的警告应验），像指南针一样指向某条通道；卢卡脸上的银纹在紫光里泛起微光
        hook: 石头越热，纹路越亮——两者像在隔空对话，而守门人说过"这条路战前就封了"
      - num: 32
        title: 地下城里的铃木
        goal: 铃木意外出现在地下城（督导子爵府物资队），欲言又止；塞给卢卡一叠"夫人批的研究材料"；提到"夫人等这个入口，等了很多年"
        hook: 铃木临别塞来一张对折的字条，一阵穿堂风把它吹进了黑暗里——咱家纵身扑了出去
      - num: 33
        title: 第二层的矿区
        goal: 活跃矿区遭遇魔物（观察记口吻的遭遇战：咱家的述评+芬恩的尖叫+卢卡的记录本能）；芬恩的失败发明意外派上用场
        hook: 魔物巢穴的角落里，有一只落满灰的背包——卢卡看到它的瞬间，整个人静了下来
      - num: 34
        title: 亡友的笔记
        goal: 背包属于卢卡的亡友；笔记记录了他当年独自下城的原因与"歌声与门"的线索；卢卡在火光边读完，第一次在咱家面前红了眼眶
        hook: 笔记里夹着半张手绘地图——残边弧度与古斯塔夫那本旧书的缺页完全吻合
      - num: 35
        title: 猫的密道
        goal: 咱家连夜回城搬救兵——黑影开密道，猫社会全力协作；两队人马（人与猫）在第三层边缘的结晶厅汇合；黑影与卢卡互相致意
        hook: 密道石壁上的爪印记号，与塞尔文地图边缘那串猫爪标记，出自同一套猫语
      - num: 36
        title: 歌声
        goal: 第三层"歌声"初现——听见的人会不由自主回应；塞尔文的规则"不要回应"与亡友笔记"以歌还歌"相互印证；东风的《地下城之歌》第一次完整唱响
        hook: 歌声停了。整层楼安静得像屏住了呼吸——因为"它"注意到了卢卡脸上的纹路
      - num: 37
        title: 紫色的房间
        goal: 纹路的源头——一个镶满呼吸石的圆形房间，中央一台沉睡的古器；老学者线回收：墙上的手记证明他当年到过这里，并选择了沉默
        hook: 古器表面的凹槽走向，与卢卡脸上银色纹路的走向完全互补——像一把锁在等一把钥匙
      - num: 38
        title: 呼吸与承诺
        goal: 卷末收束：不揭全部底牌。卢卡把呼吸石贴近纹路，一明一暗的光第一次同步；众人无言。归途雪化，新年祭的锣声在城里响起
        hook: 子爵夫人的信到了——"新年祭后，来子爵府。带上你的猫。"
